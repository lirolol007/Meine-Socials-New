# Einstellungen für Pages CMS (app.pagescms.org)
# Diese Datei muss im Repository als ".pages.yml" gespeichert werden (mit Punkt am Anfang).

media:
  - name: images
    label: Bilder
    input: images
    output: /images
    rename: safe
    extensions:
      - png
      - jpg
      - jpeg
      - gif
      - webp
      - svg
      - ico
  - name: fonts
    label: Schriftarten
    input: fonts
    output: /fonts
    rename: safe
    extensions:
      - woff2
      - woff
      - ttf
      - otf
content:
  - name: seite
    label: Meine Seite
    type: file
    path: data.json
    format: json
    fields:
      - name: site
        label: Allgemein
        type: object
        fields:
          - name: title
            label: Dein Name / Seitenname
            type: string
          - name: tagline
            label: Kleines Schild über der Überschrift (z. B. Creator · Gamer)
            type: string
          - name: avatar
            label: Profilbild
            type: image
            options:
              media: images
          - name: avatarCrop
            label: Zoom und Ausschnitt (optional)
            type: string
            description: Wert aus dem Bild-Ausschnitt-Helfer einfügen (deine-domain.de/ausschnitt.html), z. B. 140 50 35. Leer = unverändert.
            pattern:
              regex: ^(\d{2,3}\s+\d{1,3}\s+\d{1,3})?$
              message: Bitte drei Zahlen mit Leerzeichen, z. B. 140 50 35, oder das Feld leer lassen
          - name: favicon
            label: Logo im Browser-Tab (optional, leer = Profilbild)
            type: image
            options:
              media: images
          - name: accent
            label: Akzentfarbe (Hex-Code, z. B.
            type: string
            pattern:
              regex: ^#[0-9a-fA-F]{6}$
              message: 'Bitte einen Hex-Code wie #d0d0d6 eintragen'
      - name: font
        label: Schriftarten
        type: object
        fields:
          - name: preset
            label: Schriftart für Texte (Vorlage)
            type: select
            default: standard
            options:
              values:
                - name: standard
                  label: Standard (sauber)
                - name: rund
                  label: Rund und freundlich
                - name: comic
                  label: Comic
                - name: handschrift
                  label: Handschrift
                - name: serif
                  label: Serif (klassisch)
                - name: mono
                  label: Monospace (Code-Look)
          - name: file
            label: Eigene Schrift als Datei für Texte (ersetzt die Vorlage)
            type: file
            options:
              media: fonts
          - name: headingPreset
            label: Schriftart für Überschriften (Vorlage)
            type: select
            default: same
            options:
              values:
                - name: same
                  label: Wie die Texte
                - name: standard
                  label: Standard (sauber)
                - name: rund
                  label: Rund und freundlich
                - name: comic
                  label: Comic
                - name: handschrift
                  label: Handschrift
                - name: serif
                  label: Serif (klassisch)
                - name: mono
                  label: Monospace (Code-Look)
          - name: headingFile
            label: Eigene Schrift als Datei für Überschriften (optional)
            type: file
            options:
              media: fonts
      - name: backgrounds
        label: Hintergrundbilder
        type: object
        fields:
          - name: home
            label: Hintergrund Startseite (optional)
            type: image
            options:
              media: images
          - name: homeCrop
            label: Zoom und Ausschnitt (optional)
            type: string
            description: Wert aus dem Bild-Ausschnitt-Helfer einfügen (deine-domain.de/ausschnitt.html), z. B. 140 50 35. Leer = unverändert.
            pattern:
              regex: ^(\d{2,3}\s+\d{1,3}\s+\d{1,3})?$
              message: Bitte drei Zahlen mit Leerzeichen, z. B. 140 50 35, oder das Feld leer lassen
          - name: blog
            label: Hintergrund Blog (optional)
            type: image
            options:
              media: images
          - name: blogCrop
            label: Zoom und Ausschnitt (optional)
            type: string
            description: Wert aus dem Bild-Ausschnitt-Helfer einfügen (deine-domain.de/ausschnitt.html), z. B. 140 50 35. Leer = unverändert.
            pattern:
              regex: ^(\d{2,3}\s+\d{1,3}\s+\d{1,3})?$
              message: Bitte drei Zahlen mit Leerzeichen, z. B. 140 50 35, oder das Feld leer lassen
          - name: friends
            label: Hintergrund Freunde (optional)
            type: image
            options:
              media: images
          - name: friendsCrop
            label: Zoom und Ausschnitt (optional)
            type: string
            description: Wert aus dem Bild-Ausschnitt-Helfer einfügen (deine-domain.de/ausschnitt.html), z. B. 140 50 35. Leer = unverändert.
            pattern:
              regex: ^(\d{2,3}\s+\d{1,3}\s+\d{1,3})?$
              message: Bitte drei Zahlen mit Leerzeichen, z. B. 140 50 35, oder das Feld leer lassen
          - name: impressum
            label: Hintergrund Impressum (optional)
            type: image
            options:
              media: images
          - name: impressumCrop
            label: Zoom und Ausschnitt (optional)
            type: string
            description: Wert aus dem Bild-Ausschnitt-Helfer einfügen (deine-domain.de/ausschnitt.html), z. B. 140 50 35. Leer = unverändert.
            pattern:
              regex: ^(\d{2,3}\s+\d{1,3}\s+\d{1,3})?$
              message: Bitte drei Zahlen mit Leerzeichen, z. B. 140 50 35, oder das Feld leer lassen
          - name: dim
            label: Abdunkelung der Hintergrundbilder in Prozent (0 = keine, Standard 55, max. 90)
            type: number
            default: 55
            options:
              min: 0
              max: 90
      - name: glow
        label: Glow-Effekte
        type: object
        fields:
          - name: color
            label: Glow-Farbe als Hex-Code (z. B.
            type: string
            pattern:
              regex: ^(#[0-9a-fA-F]{6})?$
              message: 'Bitte einen Hex-Code wie #7aa2ff eintragen oder das Feld leer lassen'
          - name: buttons
            label: Glow hinter den Buttons
            type: select
            default: 'off'
            options:
              values:
                - name: 'off'
                  label: Aus
                - name: hover
                  label: Nur beim Drüberfahren
                - name: always
                  label: Immer sanft sichtbar
      - name: nav
        label: Menü-Buttons (Beschriftung)
        type: object
        fields:
          - name: home
            label: Button 1 (Startseite)
            type: string
          - name: blog
            label: Button 2 (Blog)
            type: string
          - name: friends
            label: Button 3 (Freunde)
            type: string
          - name: impressum
            label: Button 4 (Impressum)
            type: string
      - name: home
        label: Startseite
        type: object
        fields:
          - name: headline
            label: Hauptüberschrift
            type: string
          - name: text
            label: Text unter der Überschrift
            type: text
          - name: buttons
            label: Buttons im Kopfbereich (optional)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{label}'
            fields:
              - name: label
                label: Beschriftung (z. B. Auf Twitch ansehen)
                type: string
              - name: url
                label: Ziel
                type: string
                description: 'Ganze Adresse (https://…) oder eine Seite der Website: #/blog, #/friends, #/impressum'
              - name: style
                label: Aussehen
                type: select
                default: primary
                options:
                  values:
                    - name: primary
                      label: Hell (Hauptbutton)
                    - name: secondary
                      label: Dunkel (Nebenbutton)
          - name: image
            label: Eigenes Bild / Logo auf der Startseite (optional)
            type: image
            options:
              media: images
          - name: imageCrop
            label: Zoom und Ausschnitt (optional)
            type: string
            description: Wert aus dem Bild-Ausschnitt-Helfer einfügen (deine-domain.de/ausschnitt.html), z. B. 140 50 35. Leer = unverändert.
            pattern:
              regex: ^(\d{2,3}\s+\d{1,3}\s+\d{1,3})?$
              message: Bitte drei Zahlen mit Leerzeichen, z. B. 140 50 35, oder das Feld leer lassen
          - name: sections
            label: Bereiche der Startseite (hinzufügen, löschen, verschieben)
            description: Leer = die Seite zeigt Kanäle, Beiträge und Freunde. Sobald du hier Bereiche einträgst, erscheinen genau diese in dieser Reihenfolge.
            type: block
            list:
              collapsible:
                collapsed: true
                summary: '{title}'
            blockKey: type
            blocks:
              - name: channels
                label: Meine Kanäle (deine Links als Karten)
                fields:
                  - name: title
                    label: Überschrift
                    type: string
                    default: Meine Kanäle
              - name: text
                label: Text mit Bild (z. B. Über mich)
                fields:
                  - name: title
                    label: Überschrift
                    type: string
                    default: Über mich
                  - name: text
                    label: Text (Leerzeile = neuer Absatz)
                    type: text
                  - name: image
                    label: Bild (optional)
                    type: image
                    options:
                      media: images
                  - name: imageCrop
                    label: Zoom und Ausschnitt (optional)
                    type: string
                    description: Wert aus dem Bild-Ausschnitt-Helfer einfügen (deine-domain.de/ausschnitt.html), z. B. 140 50 35. Leer = unverändert.
                    pattern:
                      regex: ^(\d{2,3}\s+\d{1,3}\s+\d{1,3})?$
                      message: Bitte drei Zahlen mit Leerzeichen, z. B. 140 50 35, oder das Feld leer lassen
                  - name: imageSide
                    label: Bild steht
                    type: select
                    default: left
                    options:
                      values:
                        - name: left
                          label: Links
                        - name: right
                          label: Rechts
                  - name: tags
                    label: Stichworte (mit Komma getrennt, optional)
                    type: string
                    description: z. B. Gaming, Streaming, Community
                  - name: buttonLabel
                    label: Button-Beschriftung (optional)
                    type: string
                  - name: buttonUrl
                    label: Button-Ziel (optional)
                    type: string
                    description: 'https://… oder #/blog, #/friends'
              - name: posts
                label: Neueste Beiträge
                fields:
                  - name: title
                    label: Überschrift
                    type: string
                    default: Neueste Beiträge
                  - name: count
                    label: Wie viele anzeigen?
                    type: number
                    default: 3
                    options:
                      min: 1
                      max: 12
                  - name: linkLabel
                    label: Text des Links rechts (leer = kein Link)
                    type: string
                    default: Alle Beiträge →
              - name: friends
                label: Freunde
                fields:
                  - name: title
                    label: Überschrift
                    type: string
                    default: Freunde
                  - name: count
                    label: Wie viele anzeigen?
                    type: number
                    default: 4
                    options:
                      min: 1
                      max: 12
                  - name: linkLabel
                    label: Text des Links rechts (leer = kein Link)
                    type: string
                    default: Alle ansehen →
      - name: links
        label: Meine Links (Startseite)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{label}'
        fields:
          - name: label
            label: Name (z. B. Instagram)
            type: string
          - name: url
            label: Adresse (https://…)
            type: string
          - name: sub
            label: Zeile unter dem Namen (optional, z. B. @deinname)
            type: string
            description: Leer = die Domain, z. B. instagram.com
          - name: icon
            label: Icon (optional, Emoji. Leer = automatisch)
            type: string
          - name: logo
            label: Eigenes Logo / Bild (ersetzt das Icon, optional)
            type: image
            options:
              media: images
          - name: logoCrop
            label: Zoom und Ausschnitt (optional)
            type: string
            description: Wert aus dem Bild-Ausschnitt-Helfer einfügen (deine-domain.de/ausschnitt.html), z. B. 140 50 35. Leer = unverändert.
            pattern:
              regex: ^(\d{2,3}\s+\d{1,3}\s+\d{1,3})?$
              message: Bitte drei Zahlen mit Leerzeichen, z. B. 140 50 35, oder das Feld leer lassen
      - name: posts
        label: Blog-Beiträge
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
          - name: title
            label: Titel
            type: string
          - name: date
            label: Datum
            type: date
            options:
              format: yyyy-MM-dd
          - name: cover
            label: Titelbild
            type: image
            options:
              media: images
          - name: coverCrop
            label: Zoom und Ausschnitt (optional)
            type: string
            description: Wert aus dem Bild-Ausschnitt-Helfer einfügen (deine-domain.de/ausschnitt.html), z. B. 140 50 35. Leer = unverändert.
            pattern:
              regex: ^(\d{2,3}\s+\d{1,3}\s+\d{1,3})?$
              message: Bitte drei Zahlen mit Leerzeichen, z. B. 140 50 35, oder das Feld leer lassen
          - name: preview
            label: Vorschau-Text (kurz, erscheint auf der Karte)
            type: text
          - name: content
            label: Beitragstext (Leerzeile = neuer Absatz, **fett**, [Text](https://link), ![](images/bild.jpg))
            type: text
      - name: friends
        label: Freunde
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{name}'
        fields:
          - name: name
            label: Name
            type: string
          - name: avatar
            label: Profilbild
            type: image
            options:
              media: images
          - name: avatarCrop
            label: Zoom und Ausschnitt (optional)
            type: string
            description: Wert aus dem Bild-Ausschnitt-Helfer einfügen (deine-domain.de/ausschnitt.html), z. B. 140 50 35. Leer = unverändert.
            pattern:
              regex: ^(\d{2,3}\s+\d{1,3}\s+\d{1,3})?$
              message: Bitte drei Zahlen mit Leerzeichen, z. B. 140 50 35, oder das Feld leer lassen
          - name: bio
            label: Kurztext (optional)
            type: text
          - name: links
            label: Social-Media-Links
            type: object
            list: true
            fields:
              - name: label
                label: Name (z. B. Instagram)
                type: string
              - name: url
                label: Adresse (https://…)
                type: string
              - name: icon
                label: Icon (optional, Emoji. Leer = automatisch)
                type: string
              - name: logo
                label: Eigenes Logo / Bild (ersetzt das Icon, optional)
                type: image
                options:
                  media: images
              - name: logoCrop
                label: Zoom und Ausschnitt (optional)
                type: string
                description: Wert aus dem Bild-Ausschnitt-Helfer einfügen (deine-domain.de/ausschnitt.html), z. B. 140 50 35. Leer = unverändert.
                pattern:
                  regex: ^(\d{2,3}\s+\d{1,3}\s+\d{1,3})?$
                  message: Bitte drei Zahlen mit Leerzeichen, z. B. 140 50 35, oder das Feld leer lassen
      - name: impressum
        label: Impressum
        type: object
        fields:
          - name: title
            label: Überschrift
            type: string
          - name: text
            label: Text (Leerzeile = neuer Absatz)
            type: text
