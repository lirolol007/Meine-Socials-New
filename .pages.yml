# Einstellungen für Pages CMS (app.pagescms.org)
# Diese Datei muss im Repository als ".pages.yml" gespeichert werden (mit Punkt am Anfang).

media:
  - name: images
    label: Bilder
    input: images
    output: /images
    rename: safe
    extensions: [png, jpg, jpeg, gif, webp, svg, ico]
  - name: fonts
    label: Schriftarten
    input: fonts
    output: /fonts
    rename: safe
    extensions: [woff2, woff, ttf, otf]

content:
  - name: seite
    label: Meine Seite
    type: file
    path: data.json
    format: json
    fields:
      - name: site
        label: Allgemein
        type: object
        fields:
          - name: title
            label: Dein Name / Seitenname
            type: string
          - name: tagline
            label: Untertitel unter dem Namen
            type: string
          - name: avatar
            label: Profilbild
            type: image
            options:
              media: images
          - name: favicon
            label: Logo im Browser-Tab (optional, leer = Profilbild)
            type: image
            options:
              media: images
          - name: accent
            label: Akzentfarbe (Hex-Code, z. B. #d0d0d6)
            type: string
            pattern:
              regex: "^#[0-9a-fA-F]{6}$"
              message: "Bitte einen Hex-Code wie #d0d0d6 eintragen"

      - name: font
        label: Schriftarten
        type: object
        fields:
          - name: preset
            label: Schriftart für Texte (Vorlage)
            type: select
            default: standard
            options:
              values:
                - name: standard
                  label: Standard (sauber)
                - name: rund
                  label: Rund und freundlich
                - name: comic
                  label: Comic
                - name: handschrift
                  label: Handschrift
                - name: serif
                  label: Serif (klassisch)
                - name: mono
                  label: Monospace (Code-Look)
          - name: file
            label: Eigene Schrift als Datei für Texte (ersetzt die Vorlage)
            type: file
            options:
              media: fonts
          - name: headingPreset
            label: Schriftart für Überschriften (Vorlage)
            type: select
            default: same
            options:
              values:
                - name: same
                  label: Wie die Texte
                - name: standard
                  label: Standard (sauber)
                - name: rund
                  label: Rund und freundlich
                - name: comic
                  label: Comic
                - name: handschrift
                  label: Handschrift
                - name: serif
                  label: Serif (klassisch)
                - name: mono
                  label: Monospace (Code-Look)
          - name: headingFile
            label: Eigene Schrift als Datei für Überschriften (optional)
            type: file
            options:
              media: fonts

      - name: nav
        label: Menü-Buttons (Beschriftung)
        type: object
        fields:
          - name: home
            label: Button 1 (Startseite)
            type: string
          - name: blog
            label: Button 2 (Blog)
            type: string
          - name: friends
            label: Button 3 (Freunde)
            type: string
          - name: impressum
            label: Button 4 (Impressum)
            type: string

      - name: home
        label: Startseite
        type: object
        fields:
          - name: headline
            label: Überschrift
            type: string
          - name: text
            label: Begrüßungstext
            type: text
          - name: image
            label: Eigenes Bild / Logo auf der Startseite (optional)
            type: image
            options:
              media: images

      - name: links
        label: Meine Links (Startseite)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Name (z. B. Instagram)
            type: string
          - name: url
            label: Adresse (https://…)
            type: string
          - name: icon
            label: Icon (optional, Emoji. Leer = automatisch)
            type: string
          - name: logo
            label: Eigenes Logo / Bild (ersetzt das Icon, optional)
            type: image
            options:
              media: images

      - name: posts
        label: Blog-Beiträge
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Titel
            type: string
          - name: date
            label: Datum
            type: date
            options:
              format: yyyy-MM-dd
          - name: cover
            label: Titelbild
            type: image
            options:
              media: images
          - name: preview
            label: Vorschau-Text (kurz, erscheint auf der Karte)
            type: text
          - name: content
            label: Beitragstext (Leerzeile = neuer Absatz, **fett**, [Text](https://link), ![](images/bild.jpg))
            type: text

      - name: friends
        label: Freunde
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
          - name: avatar
            label: Profilbild
            type: image
            options:
              media: images
          - name: bio
            label: Kurztext (optional)
            type: text
          - name: links
            label: Social-Media-Links
            type: object
            list: true
            fields:
              - name: label
                label: Name (z. B. Instagram)
                type: string
              - name: url
                label: Adresse (https://…)
                type: string
              - name: icon
                label: Icon (optional, Emoji. Leer = automatisch)
                type: string
              - name: logo
                label: Eigenes Logo / Bild (ersetzt das Icon, optional)
                type: image
                options:
                  media: images

      - name: impressum
        label: Impressum
        type: object
        fields:
          - name: title
            label: Überschrift
            type: string
          - name: text
            label: Text (Leerzeile = neuer Absatz)
            type: text
